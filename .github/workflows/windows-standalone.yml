name: Windows standalone service

on:
  pull_request:
    paths:
      - ".github/workflows/windows-standalone.yml"
      - "apps/server/**"
      - "packages/contracts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

jobs:
  windows-standalone:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows x64 standalone archive
        shell: pwsh
        env:
          HENSHIN_ARTIFACT_DIR: ${{ runner.temp }}\henshin-artifact
        run: |
          New-Item -ItemType Directory -Force -Path $env:HENSHIN_ARTIFACT_DIR | Out-Null
          Write-Host "Windows: $([System.Environment]::OSVersion.VersionString)"
          Write-Host "PowerShell: $($PSVersionTable.PSVersion)"
          Write-Host "Node: $(node --version), architecture: $(node -p 'process.arch')"
          Write-Host "pnpm: $(pnpm --version)"
          pnpm build:server:distribution
          if ($LASTEXITCODE -ne 0) { throw "standalone distribution build failed" }

      - name: Upload Windows x64 standalone archive
        uses: actions/upload-artifact@v4
        with:
          name: henshin-server-windows-x64
          path: ${{ runner.temp }}\henshin-artifact\*.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Restore workspace test dependencies
        run: pnpm install --frozen-lockfile

      - name: Unpack outside the checkout
        id: unpack
        shell: pwsh
        env:
          HENSHIN_ARTIFACT_DIR: ${{ runner.temp }}\henshin-artifact
        run: |
          $archive = @(Get-ChildItem -LiteralPath $env:HENSHIN_ARTIFACT_DIR -Filter "henshin-server-*.tar.gz" -File)
          if ($archive.Count -ne 1) { throw "expected exactly one standalone archive" }
          if ($archive.Name -notmatch "win32-x64") { throw "unexpected Windows archive: $($archive.Name)" }
          Write-Host "Artifact: $($archive.FullName)"
          $unpack = Join-Path $env:RUNNER_TEMP "henshin standalone unpacked path"
          Remove-Item -LiteralPath $unpack -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $unpack | Out-Null
          tar -xzf $archive.FullName -C $unpack
          if ($LASTEXITCODE -ne 0) { throw "standalone archive extraction failed" }
          if (-not (Test-Path -LiteralPath (Join-Path $unpack "server.mjs"))) { throw "server entrypoint missing" }
          $reparsePoints = @(Get-ChildItem -LiteralPath $unpack -Recurse -Force | Where-Object {
            ($_.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0
          })
          if ($reparsePoints.Count -ne 0) {
            $names = ($reparsePoints | ForEach-Object { $_.Name }) -join ", "
            throw "archive contains unsupported reparse points: $names"
          }
          "archive=$($archive.FullName)" >> $env:GITHUB_OUTPUT
          "unpack=$unpack" >> $env:GITHUB_OUTPUT

      - name: Exercise relocated service with native cover decoding
        shell: pwsh
        env:
          HENSHIN_SERVER_ENTRYPOINT: ${{ steps.unpack.outputs.unpack }}\server.mjs
          HENSHIN_SERVER_CWD: ${{ steps.unpack.outputs.unpack }}
          HENSHIN_TEMP_ROOT: ${{ runner.temp }}\henshin test temp
        run: |
          New-Item -ItemType Directory -Force -Path $env:HENSHIN_TEMP_ROOT | Out-Null
          $env:TEMP = $env:HENSHIN_TEMP_ROOT
          $env:TMP = $env:HENSHIN_TEMP_ROOT
          $nodePath = Split-Path -Parent (Get-Command node -ErrorAction Stop).Source
          $pnpmPath = Split-Path -Parent (Get-Command pnpm -ErrorAction Stop).Source
          $env:PATH = @(
            $nodePath
            $pnpmPath
            (Join-Path $env:SystemRoot "System32")
            $env:SystemRoot
          ) -join [System.IO.Path]::PathSeparator
          Remove-Item Env:NODE_PATH -ErrorAction SilentlyContinue
          pnpm exec vitest run apps/server/test/independent-service.test.ts apps/server/test/thumbnail.test.ts

  standalone-smoke:
    name: Standalone archive smoke without checkout
    needs: windows-standalone
    runs-on: windows-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Download Windows x64 standalone archive
        uses: actions/download-artifact@v4
        with:
          name: henshin-server-windows-x64
          path: ${{ runner.temp }}\henshin-standalone-download

      - name: Provision and exercise the documented foreground CLI
        shell: pwsh
        env:
          HENSHIN_ARCHIVE_DIR: ${{ runner.temp }}\henshin-standalone-download
        run: |
          $ErrorActionPreference = "Stop"
          $archive = @(Get-ChildItem -LiteralPath $env:HENSHIN_ARCHIVE_DIR -Filter "*.tar.gz" -File)
          if ($archive.Count -ne 1) { throw "expected exactly one downloaded standalone archive" }
          if ($archive.Name -notmatch "win32-x64") { throw "unexpected Windows archive: $($archive.Name)" }

          $unpack = Join-Path $env:RUNNER_TEMP "henshin standalone smoke path"
          $dataDir = Join-Path $env:RUNNER_TEMP "henshin standalone smoke data"
          Remove-Item -LiteralPath $unpack -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $dataDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $unpack, $dataDir | Out-Null
          tar -xzf $archive.FullName -C $unpack
          if ($LASTEXITCODE -ne 0) { throw "standalone archive extraction failed" }

          $entrypoint = Join-Path $unpack "server.mjs"
          if (-not (Test-Path -LiteralPath $entrypoint -PathType Leaf)) { throw "server entrypoint missing" }
          $node = (Get-Command node -ErrorAction Stop).Source
          $port = "4317"
          $baseUrl = "http://127.0.0.1:$port"

          $initializeOutput = Join-Path $env:RUNNER_TEMP "henshin standalone initialize.out"
          $initializeError = Join-Path $env:RUNNER_TEMP "henshin standalone initialize.err"
          & $node $entrypoint "--data-dir" $dataDir "--initialize-owner" 1> $initializeOutput 2> $initializeError
          if ($LASTEXITCODE -ne 0) { throw "documented owner initialization failed" }
          $tokenLine = Get-Content -LiteralPath $initializeOutput | Where-Object { $_ -match '^owner_token=\S+$' } | Select-Object -First 1
          $tokenMatch = [System.Text.RegularExpressions.Regex]::Match([string]$tokenLine, '^owner_token=(\S+)$')
          if (-not $tokenMatch.Success) { throw "owner initialization did not return a token" }
          $token = $tokenMatch.Groups[1].Value

          function Start-DocumentedServer {
            param([string]$OutputPath, [string]$ErrorPath)
            $info = [System.Diagnostics.ProcessStartInfo]::new()
            $info.FileName = $node
            $info.WorkingDirectory = $unpack
            $info.UseShellExecute = $false
            $info.RedirectStandardOutput = $true
            $info.RedirectStandardError = $true
            foreach ($argument in @($entrypoint, "--data-dir", $dataDir, "--port", $port)) {
              [void]$info.ArgumentList.Add($argument)
            }
            $process = [System.Diagnostics.Process]::new()
            $process.StartInfo = $info
            if (-not $process.Start()) { throw "documented foreground launch failed" }
            $stdout = $process.StandardOutput.ReadToEndAsync()
            $stderr = $process.StandardError.ReadToEndAsync()
            $deadline = (Get-Date).AddSeconds(20)
            while ((Get-Date) -lt $deadline) {
              if ($process.HasExited) { throw "foreground service exited before becoming ready" }
              try {
                $probe = Invoke-WebRequest -Uri "$baseUrl/prototype/v1/handshake" -SkipHttpErrorCheck -TimeoutSec 2
                if ($probe.StatusCode -eq 401) {
                  return [pscustomobject]@{ Process = $process; Stdout = $stdout; Stderr = $stderr; OutputPath = $OutputPath; ErrorPath = $ErrorPath }
                }
              } catch {
                # The foreground service may still be binding its loopback port.
              }
              Start-Sleep -Milliseconds 250
            }
            throw "foreground service did not become ready"
          }

          function Stop-DocumentedServer {
            param($Running)
            if (-not $Running.Process.HasExited) {
              Stop-Process -Id $Running.Process.Id -Force
              [void]$Running.Process.WaitForExit(10_000)
            }
            if (-not $Running.Process.HasExited) { throw "foreground service did not stop" }
            [System.IO.File]::WriteAllText($Running.OutputPath, $Running.Stdout.GetAwaiter().GetResult())
            [System.IO.File]::WriteAllText($Running.ErrorPath, $Running.Stderr.GetAwaiter().GetResult())
          }

          $first = $null
          $second = $null
          try {
            $first = Start-DocumentedServer (Join-Path $env:RUNNER_TEMP "henshin standalone first.out") (Join-Path $env:RUNNER_TEMP "henshin standalone first.err")
            $headers = @{ Authorization = "Bearer $token" }
            $authenticated = Invoke-WebRequest -Uri "$baseUrl/prototype/v1/handshake" -Headers $headers -TimeoutSec 5
            if ($authenticated.StatusCode -ne 200) { throw "documented foreground service rejected the owner token" }
            $firstIdentity = $authenticated.Content | ConvertFrom-Json

            $wrong = Invoke-WebRequest -Uri "$baseUrl/prototype/v1/handshake" -Headers @{ Authorization = "Bearer not-the-token" } -SkipHttpErrorCheck -TimeoutSec 5
            if ($wrong.StatusCode -ne 401) { throw "documented foreground service accepted a wrong bearer token" }

            Stop-DocumentedServer $first
            $first = $null
            $second = Start-DocumentedServer (Join-Path $env:RUNNER_TEMP "henshin standalone second.out") (Join-Path $env:RUNNER_TEMP "henshin standalone second.err")
            $restarted = Invoke-WebRequest -Uri "$baseUrl/prototype/v1/handshake" -Headers $headers -TimeoutSec 5
            if ($restarted.StatusCode -ne 200) { throw "restarted foreground service rejected the owner token" }
            $secondIdentity = $restarted.Content | ConvertFrom-Json
            if ($secondIdentity.instance_id -ne $firstIdentity.instance_id) { throw "restart did not preserve the instance identity" }
            if ($secondIdentity.epoch -eq $firstIdentity.epoch) { throw "restart did not create a new authority epoch" }
          } finally {
            if ($null -ne $second) { Stop-DocumentedServer $second }
            if ($null -ne $first) { Stop-DocumentedServer $first }
          }
