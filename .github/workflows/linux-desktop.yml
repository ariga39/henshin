name: Linux arm64 desktop

on:
  pull_request:
    paths:
      - ".github/workflows/linux-desktop.yml"
      - "apps/desktop/**"
      - "apps/server/**"
      - "packages/contracts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

jobs:
  linux-desktop:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            fuse3 libfuse2t64 libasound2t64 libgbm1 libgtk-3-0t64 libnss3 libxshmfence1 libxss1 \
            psmisc squashfs-tools xvfb xauth zip

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux arm64 AppImage
        env:
          HENSHIN_DESKTOP_ARTIFACT_DIR: ${{ runner.temp }}/henshin-desktop-output
        run: |
          test "$(node -p 'process.platform')" = linux
          test "$(node -p 'process.arch')" = arm64
          pnpm --filter @henshin/desktop package:linux

      - name: Record AppImage and FUSE evidence
        env:
          HENSHIN_DESKTOP_ARTIFACT_DIR: ${{ runner.temp }}/henshin-desktop-output
        run: |
          file "$HENSHIN_DESKTOP_ARTIFACT_DIR"/*.AppImage
          sha256sum "$HENSHIN_DESKTOP_ARTIFACT_DIR"/*.AppImage
          test -e /dev/fuse
          fusermount3 --version

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: henshin-desktop-linux-arm64
          path: ${{ runner.temp }}/henshin-desktop-output/*.AppImage
          if-no-files-found: error
          retention-days: 7

      - name: Restore workspace test dependencies
        run: pnpm install --frozen-lockfile

      - name: Exercise AppImage through its normal entrypoint
        env:
          HENSHIN_DESKTOP_ARTIFACT_DIR: ${{ runner.temp }}/henshin-desktop-output
          HENSHIN_PACKAGED_PROFILE: ${{ runner.temp }}/henshin packaged profile
          HENSHIN_PACKAGED_COLLECTION: ${{ runner.temp }}/henshin packaged collection
        run: |
          mkdir -p "$HENSHIN_PACKAGED_PROFILE" "$HENSHIN_PACKAGED_COLLECTION"
          export DISPLAY=:99
          Xvfb "$DISPLAY" -screen 0 1280x900x24 >"$RUNNER_TEMP/xvfb.log" 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          appimage=$(find "$HENSHIN_DESKTOP_ARTIFACT_DIR" -maxdepth 1 -name '*.AppImage' -type f -print -quit)
          sandbox_source="$RUNNER_TEMP/henshin-sandbox-source"
          rm -rf "$sandbox_source"
          mkdir -p "$sandbox_source"
          (cd "$sandbox_source" && "$appimage" --appimage-extract chrome-sandbox >/dev/null)
          sudo install -o root -g root -m 4755 \
            "$sandbox_source/squashfs-root/chrome-sandbox" \
            "$RUNNER_TEMP/henshin-chrome-sandbox"
          test -u "$RUNNER_TEMP/henshin-chrome-sandbox"
          HENSHIN_PACKAGED_EXECUTABLE="$appimage" \
          HENSHIN_PACKAGED_SANDBOX="$RUNNER_TEMP/henshin-chrome-sandbox" \
          CHROME_DEVEL_SANDBOX="$RUNNER_TEMP/henshin-chrome-sandbox" \
            pnpm exec node apps/desktop/test/packaged-linux.mjs
